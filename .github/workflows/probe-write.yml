name: probe-write
on:
  workflow_dispatch:
  push:
    paths:
      - lulafind/scripts/probe-write.mjs
      - .github/workflows/probe-write.yml
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch historical admin key and probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          echo "fetching historical key" > /tmp/probe.txt
          gh api "repos/${{ github.repository }}/contents/uploads/lulafinds-app-firebase-adminsdk-fbsvc-cb7ffa9ade.json?ref=fc481d00" --jq .content | base64 -d > /tmp/fb-admin.json
          echo "key bytes $(wc -c < /tmp/fb-admin.json 2>/dev/null || echo 0)" >> /tmp/probe.txt
          if [ -s /tmp/fb-admin.json ]; then
            node lulafind/scripts/probe-write.mjs /tmp/fb-admin.json >> /tmp/probe.txt 2>&1
          else
            echo "key fetch failed" >> /tmp/probe.txt
          fi
          code=$?
          rm -f /tmp/fb-admin.json
          jq -n --rawfile text /tmp/probe.txt --arg code "$code" '{body: ("probe exit " + $code + "\n```\n" + $text + "\n```")}' \
            | gh api --method POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --input - >> /tmp/probe.txt
          exit "$code"
