name: probe-write
on:
  workflow_dispatch:
  push:
    paths:
      - lulafind/scripts/probe-write.mjs
      - .github/workflows/probe-write.yml
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch historical admin key and probe
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_DB: ${{ secrets.SUPABASE_DB_PASSWORD != '' }}
          HAS_SR: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
          HAS_PAT: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
          HAS_SB: ${{ secrets.SUPABASE_SECRET_KEY != '' }}
        run: |
          set +e
          echo "secrets db=$HAS_DB sr=$HAS_SR pat=$HAS_PAT sb=$HAS_SB" > /tmp/probe.txt
          node lulafind/scripts/probe-write.mjs >> /tmp/probe.txt 2>&1
          code=$?
          jq -n --rawfile text /tmp/probe.txt --arg code "$code" '{body: ("probe exit " + $code + "\n```\n" + $text + "\n```")}' \
            | gh api --method POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --input - >> /tmp/probe.txt
          exit "$code"
