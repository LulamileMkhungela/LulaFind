# Builds installable Android and iOS test builds and attaches them to a GitHub
# release, so they can be downloaded (and passed on to testers) without anyone
# needing Android Studio or Xcode.
#
#   Android -> LulaFind-<sha>-android.apk      (debug-signed: installs on any phone)
#   iOS     -> LulaFind-<sha>-ios-unsigned.ipa (unsigned: sideload to install)
#
# Run it by pushing to the test branch, or from the Actions tab ("Run workflow").
name: Mobile test builds

on:
  push:
    branches:
      - arena/01a0fc52-lulafind
      - arena/01a1032d-lulafind
      - arena/01a109c7-lulafind
      - arena/f2738992-lulafind
    paths:
      - 'lulafind/src/**'
      - 'lulafind/android/**'
      - 'lulafind/ios/**'
      - 'lulafind/package.json'
      - 'lulafind/capacitor.config.ts'
      - 'lulafind/angular.json'
      - '.github/workflows/mobile-builds.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lulafind/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The Gradle distribution is downloaded from GitHub's release CDN, and on
      # 2 October 2026 that CDN answered 502 to a build that had nothing wrong
      # with it - step 8 failed while the web build and cap sync in the same job
      # had both succeeded. Caching the wrapper and the dependency caches means
      # that download happens once rather than on every run, so a flaky CDN is
      # no longer able to fail a build.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('lulafind/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # The ubuntu runner image already has the Android SDK; only the packages
      # this app targets (compileSdk 36) need adding. The setup-android action
      # used to do this and failed, so the SDK is used where the image puts it.
      - name: Install the SDK packages the app targets
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install web dependencies
        working-directory: lulafind
        run: npm ci

      - name: Build the web app and copy it into the Android project
        working-directory: lulafind
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/ci-android.log
          npx cap sync android 2>&1 | tee -a /tmp/ci-android.log

      - name: Build the APK
        working-directory: lulafind/android
        run: |
          set -o pipefail
          chmod +x gradlew
          # A second attempt is allowed because the first can fail for reasons
          # that have nothing to do with this code: a 502 from the download host,
          # or a dropped connection while fetching a dependency. A real compile
          # error fails both attempts, so nothing is hidden - the log keeps both.
          ./gradlew assembleDebug --no-daemon 2>&1 | tee -a /tmp/ci-android.log \
            || ./gradlew assembleDebug --no-daemon 2>&1 | tee -a /tmp/ci-android.log

      - name: Collect the APK
        run: |
          mkdir -p dist-mobile
          cp lulafind/android/app/build/outputs/apk/debug/app-debug.apk \
             "dist-mobile/LulaFind-${GITHUB_SHA::7}-android.apk"
          ls -lh dist-mobile

      # A green "assembleDebug" says Gradle finished, not that the phone will
      # show this app. The failures that have actually reached a device here
      # were an install that opened last week's UI and a plugin registry that
      # listed none of the plugins - both packaged happily. So the file is
      # opened and read: the manifest Android will see, the web entry point,
      # the JavaScript bundle, the plugin registry and the signature. Anything
      # missing fails the build here rather than on somebody's phone.
      - name: Open the APK and read what is inside it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          APK=$(ls dist-mobile/*.apk 2>/dev/null | head -1)
          if [ ! -f "$APK" ]; then
            echo "::error::no APK was produced - nothing to publish"
            exit 1
          fi
          SIZE=$(stat -c %s "$APK")
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          UNZIP=$(unzip -l "$APK")
          INDEX=$(printf '%s\n' "$UNZIP" | grep -c 'assets/public/index.html$' || true)
          JS=$(printf '%s\n' "$UNZIP" | grep -cE 'assets/public/(main|polyfills|chunk)[^/]*\.js$' || true)
          PLUGINS=$(printf '%s\n' "$UNZIP" | grep -c 'assets/capacitor.plugins.json$' || true)
          WEBFILES=$(printf '%s\n' "$UNZIP" | grep -c 'assets/public/' || true)
          PLUGINCOUNT=$(unzip -p "$APK" assets/capacitor.plugins.json 2>/dev/null | grep -c '"classpath"' || true)

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          AAPT=$(ls "$SDK"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          BADGING=$( { "$AAPT" dump badging "$APK" 2>/dev/null || echo "aapt2 could not read the file"; } \
            | grep -E "^package:|^sdkVersion:|^targetSdkVersion:|^application-label:" || true )

          # An unsigned APK cannot be installed at all, so the signature is
          # read two independent ways: the SDK tool where the runner has one,
          # and the signing block Android itself looks for. The first run of
          # this step printed "no signature found" - and "the tool said
          # nothing" is not evidence of anything, hence both readings and a
          # gate that fails rather than publishing a file that will not install.
          APKSIGNER=$(ls "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          APKSIGNER_JAR=$(ls "$SDK"/build-tools/*/lib/apksigner.jar 2>/dev/null | sort -V | tail -1)
          if [ -x "$APKSIGNER" ]; then
            CERT=$( { "$APKSIGNER" verify --print-certs "$APK" 2>&1 || true; } | head -6 )
          elif [ -n "$APKSIGNER_JAR" ]; then
            CERT=$( { java -jar "$APKSIGNER_JAR" verify --print-certs "$APK" 2>&1 || true; } | head -6 )
          else
            CERT="apksigner is not in the SDK on this runner"
          fi
          # apksigner's wording is "Verified using v2 scheme (APK Signature
          # Scheme v2): true" - the scheme name sits between the two.
          VERIFIED=$(printf '%s\n' "$CERT" | grep -cE "Verified using v[0-9]+ scheme.*: true" || true)
          BLOCK=$(grep -a -c 'APK Sig Block 42' "$APK" || true)
          V1=$(printf '%s\n' "$UNZIP" | grep -cE 'META-INF/.*\.(RSA|DSA|EC)$' || true)

          if [ "${INDEX:-0}" -lt 1 ] || [ "${JS:-0}" -lt 1 ]; then
            echo "::error::the APK carries no web app (index.html x$INDEX, js x$JS) - not publishing it"
            exit 1
          fi
          if [ "${PLUGINS:-0}" -lt 1 ]; then
            echo "::error::the APK has no Capacitor plugin registry - every plugin call would fail on the phone"
            exit 1
          fi
          if printf '%s\n' "$CERT" | grep -q "DOES NOT VERIFY"; then
            echo "::error::the APK does not verify - Android will refuse to install it"
            printf '%s\n' "$CERT"
            exit 1
          fi
          if [ "${VERIFIED:-0}" -lt 1 ] && [ "${BLOCK:-0}" -lt 1 ]; then
            echo "::error::no signature in the APK (v1 files x$V1) - Android will refuse to install it"
            printf '%s\n' "$CERT"
            exit 1
          fi

          {
            printf '**Android APK built from `%s`**\n\n' "$GITHUB_SHA"
            printf '| | |\n|---|---|\n'
            printf '| file | `%s` |\n' "$(basename "$APK")"
            printf '| size | %s bytes |\n' "$SIZE"
            printf '| sha256 | `%s` |\n' "$SHA"
            printf '| web files in the package | %s (index.html x%s, js x%s) |\n' "$WEBFILES" "$INDEX" "$JS"
            printf '| plugins in the registry | %s |\n' "$PLUGINCOUNT"
            printf '| signature | verified by tool x%s, signing block x%s, v1 files x%s |\n\n' "$VERIFIED" "$BLOCK" "$V1"
            printf '```text\n%s\n%s\n%s\n```\n' "$BADGING" "$CERT" "$(printf '%s\n' "$UNZIP" | grep -E 'assets/public/(index.html|main[^/]*\.js)$' || true)"
          } > /tmp/apk-report.md
          cat /tmp/apk-report.md
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -f body="$(cat /tmp/apk-report.md)" > /dev/null 2>&1 || true

      # CI logs cannot be read from the build agent's sandbox, so a failure is
      # posted to the commit where it can be picked up.
      - name: Report a failure on the commit
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -c 3000 /tmp/ci-android.log > /tmp/tail.txt 2>/dev/null || echo "no log" > /tmp/tail.txt
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -f body="$(printf '**Android build failed**\n\n```\n%s\n```' "$(cat /tmp/tail.txt)")" \
            > /dev/null 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-apk
          path: dist-mobile/*.apk
          if-no-files-found: error

  ios:
    name: iOS build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lulafind/package-lock.json

      - name: Install web dependencies
        working-directory: lulafind
        run: npm ci

      - name: Build the web app and copy it into the iOS project
        working-directory: lulafind
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/ci-ios.log
          npx cap sync ios 2>&1 | tee -a /tmp/ci-ios.log

      - name: Resolve Swift package dependencies
        working-directory: lulafind/ios/App
        run: |
          set -o pipefail
          xcodebuild -resolvePackageDependencies -project App.xcodeproj 2>&1 | tee -a /tmp/ci-ios.log

      # -target, not -scheme: Capacitor's iOS project ships without a shared
      # scheme, and xcodebuild will not invent one on a fresh checkout.
      - name: Build the app for a device, without signing
        working-directory: lulafind/ios/App
        run: |
          set -o pipefail
          xcodebuild \
            -project App.xcodeproj \
            -target App \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee -a /tmp/ci-ios.log

      - name: Package the unsigned IPA
        run: |
          mkdir -p dist-mobile Payload
          APP=$(find lulafind/ios/App/build -name 'App.app' -type d | head -1)
          echo "packaging $APP"
          cp -R "$APP" Payload/
          zip -qry "dist-mobile/LulaFind-${GITHUB_SHA::7}-ios-unsigned.ipa" Payload
          ls -lh dist-mobile

      - name: Report a failure on the commit
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -c 3000 /tmp/ci-ios.log > /tmp/tail.txt 2>/dev/null || echo "no log" > /tmp/tail.txt
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -f body="$(printf '**iOS build failed**\n\n```\n%s\n```' "$(cat /tmp/tail.txt)")" \
            > /dev/null 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ios-ipa
          path: dist-mobile/*.ipa
          if-no-files-found: error

  release:
    name: Publish test build
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-mobile
          merge-multiple: true

      - name: Show what will be published
        run: ls -lh dist-mobile

      # Whoever downloads a 12 MB file over a phone connection wants to know
      # the file arrived whole. The checksums are taken here, from the very
      # files that are about to be attached.
      - name: Write the release notes, checksums included
        run: |
          {
            printf '%s\n' \
              'Installable builds of LulaFind, built from `${{ github.sha }}`.' \
              ''
            printf '%s\n' \
              '**Android** - `LulaFind-*-android.apk`' \
              'Download it on the phone, tap it, and allow "install unknown apps" when' \
              'Android asks. It installs over any earlier test build of the same app.' \
              ''
            printf '%s\n' \
              '**iOS** - `LulaFind-*-ios-unsigned.ipa`' \
              'Unsigned, because signing needs an Apple Developer account. To put it on' \
              'an iPhone it has to be sideloaded with a tool that re-signs it with your' \
              'own Apple ID - Sideloadly or AltStore, from a Mac or PC with the phone' \
              'plugged in. A free Apple ID works (the app then needs re-signing every' \
              'seven days). TestFlight is the alternative, but that needs a paid' \
              'Apple Developer account.' \
              ''
            printf '%s\n' \
              'Both builds talk to the same live data as the web app - they are not a' \
              'separate demo.' \
              ''
            printf '%s\n' '**sha256** - check a download before installing it:' '' '```'
            (cd dist-mobile && sha256sum ./* | sed 's|\./||')
            printf '%s\n' '```'
          } > release-notes.md
          cat release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build-${{ github.run_number }}
          name: LulaFind test build ${{ github.run_number }}
          prerelease: true
          body_path: release-notes.md
          files: dist-mobile/*

      # The numbered release above is the record of a build. This one is the
      # thing to put on a phone: one address, always the newest APK, so a link
      # can be kept, typed on a phone or handed to somebody once. The asset
      # name is fixed for the same reason - the file it points at is replaced,
      # not the address - and it is deliberately not a pre-release so that
      # GitHub's own /releases/latest/download/... also lands here.
      - name: Point the permanent link at this build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          # Every gh call names the repository. This job never checks the
          # repository out - it only downloads artifacts - and gh will not fall
          # back to GITHUB_REPOSITORY on its own: without a git directory it
          # says "failed to run git: fatal: not a git repository" and the first
          # run of this step failed on exactly that. The log is kept in a file
          # so the failure can be posted to the commit, like the Android job's.
          cat > /tmp/pin.sh <<'PIN'
          set -euo pipefail
          TAG=apk-latest
          REPO="$GITHUB_REPOSITORY"
          APK=$(ls dist-mobile/*.apk | head -1)
          cp "$APK" dist-mobile/LulaFind.apk
          SHA=$(sha256sum dist-mobile/LulaFind.apk | cut -d' ' -f1)
          SIZE=$(stat -c %s dist-mobile/LulaFind.apk)
          NOTES=$(printf '%s\n' \
            'The Android app, rebuilt and replaced by every push - this address never changes.' \
            '' \
            "Built from \`$GITHUB_SHA\` (test build $GITHUB_RUN_NUMBER)." \
            '' \
            '| APK | |' \
            '|---|---|' \
            '| name | `LulaFind.apk` |' \
            "| size | $SIZE bytes |" \
            "| sha256 | \`$SHA\` |" \
            '' \
            'Download it on the phone, tap it, and allow "install unknown apps" when Android asks.')
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release edit "$TAG" --repo "$REPO" \
              --title 'LulaFind for Android (newest build)' --notes "$NOTES"
          else
            gh release create "$TAG" --repo "$REPO" \
              --title 'LulaFind for Android (newest build)' --notes "$NOTES" \
              --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" --repo "$REPO" dist-mobile/LulaFind.apk --clobber
          gh release view "$TAG" --repo "$REPO" --json url,assets \
            --jq '"permanent link: \(.url)", (.assets[] | "  \(.name) | \(.size) bytes")'
          PIN
          bash /tmp/pin.sh 2>&1 | tee /tmp/ci-release.log
          exit "${PIPESTATUS[0]}"

      # The same reason the Android job reports its failures: CI logs live on a
      # host the build agent's sandbox cannot read, so the tail goes where it
      # can be picked up.
      - name: Report a failure on the commit
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -c 3000 /tmp/ci-release.log > /tmp/tail.txt 2>/dev/null || echo "no log" > /tmp/tail.txt
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -f body="$(printf '**Publishing the permanent link failed**\n\n```\n%s\n```' "$(cat /tmp/tail.txt)")" \
            > /dev/null 2>&1 || true
